<style>

.firm{margin:14px;padding:14px;border:1px solid #ffffff12;border-radius:9px;background:#243a5a}.firm small{display:block;color:#9bb0c3;font-size:10px;text-transform:uppercase}.firm strong{display:block;margin-top:5px}.firm span{display:block;color:#8ba1b7;font-size:11px;margin-top:5px}
.scroll{flex:1;overflow:auto;padding:4px 9px 18px}.gt{padding:12px 11px 6px;color:#7890a7;font-size:10px;font-weight:800;letter-spacing:1px}
.mi{display:flex;align-items:center;width:100%;border:0;background:transparent;color:#dce6ef;padding:10px;border-radius:7px;text-align:left;gap:9px}.mi:hover{background:#244463}.mi.active{background:linear-gradient(90deg,#147f8e,#276d83);box-shadow:inset 4px 0 #7cebe6}.mi .num{width:23px;color:#7892aa;font-size:10px}.mi .ico{width:20px;text-align:center;color:#8be0df}.mi .txt{flex:1;font-weight:650;font-size:12px}.arr{font-size:12px;color:#8ca0b3}.grp.open .arr{transform:rotate(90deg)}.sub{display:none;padding:2px 0 7px 32px}.grp.open .sub{display:block}.sub button{display:block;width:100%;border:0;background:transparent;color:#aebfd0;padding:7px 8px;text-align:left;border-radius:5px;font-size:11px}.sub button:hover{background:#213a56;color:#fff}.sub button.active{background:#e2f7f5;color:#0d5f69;font-weight:700}
.ver{border-top:1px solid #ffffff12;padding:10px 15px;color:#7f95aa;font-size:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:70px;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 20px;gap:18px}.top h2{margin:0;font-size:18px}.search{flex:1;max-width:540px}.search input{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:7px;background:#f7fafc;outline:none}.tools{margin-left:auto;display:flex;gap:7px;align-items:center}.ico{width:37px;height:37px;border:1px solid var(--b);background:#fff;border-radius:7px}.usr{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--b)}.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--v));color:#fff;font-weight:800;font-size:11px}.usr b{display:block;font-size:12px}.usr small{color:var(--m);font-size:10px}
.content{flex:1;overflow:auto;padding:20px}.head{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.head h1{margin:0;font-size:22px}.head p{margin:5px 0 0;color:var(--m);font-size:12px}.btns{display:flex;gap:7px;flex-wrap:wrap}
.btn{padding:8px 12px;border:1px solid var(--b);border-radius:6px;background:#fff;color:#42576c;font-size:12px;font-weight:650}.btn:hover{background:#f5f8fa}.primary{background:linear-gradient(135deg,var(--p),#2c8b96);color:#fff;border-color:var(--p)}.success{background:var(--g);border-color:var(--g);color:#fff}.danger{background:var(--r);border-color:var(--r);color:#fff}.sm{padding:6px 9px;font-size:10px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--b);border-top:4px solid var(--a);border-radius:8px;padding:14px;box-shadow:0 3px 14px #18334d10}.kpi:nth-child(2){border-top-color:var(--v)}.kpi:nth-child(3){border-top-color:var(--g)}.kpi:nth-child(4){border-top-color:var(--o)}.kpi:nth-child(5){border-top-color:var(--r)}.kpi small{color:var(--m)}.kpi strong{display:block;font-size:24px;margin:5px 0}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px}.card{background:#fff;border:1px solid var(--b);border-radius:8px;box-shadow:0 3px 14px #18334d08}.chead{padding:13px 15px;border-bottom:1px solid var(--b);font-size:12px;font-weight:750;display:flex;justify-content:space-between}.cbody{padding:14px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.q{padding:12px;border:1px solid var(--b);border-left:4px solid var(--a);background:#fbfdfe;border-radius:7px;text-align:left}.q:nth-child(2n){border-left-color:var(--v)}.q:nth-child(3n){border-left-color:var(--g)}.q b{display:block;font-size:12px}.q small{display:block;color:var(--m);margin-top:4px;font-size:10px}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.subnav button{border:1px solid var(--b);background:#fff;border-radius:6px;padding:7px 9px;color:#53687b;font-size:10px}.subnav button.active{background:var(--p);border-color:var(--p);color:#fff}
.table{background:#fff;border:1px solid var(--b);border-radius:8px;overflow:auto}.filter{padding:10px;background:#edf4f7;border-bottom:1px solid var(--b);display:flex;gap:7px}.filter input,.filter select{padding:8px;border:1px solid var(--b);border-radius:6px;font-size:11px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:9px;border-bottom:1px solid #edf0f3;text-align:left;font-size:10px}th{background:#e7f0f5;color:#3b566d;text-transform:uppercase}tr:hover td{background:#f1fbfa}
.badge{padding:4px 7px;border-radius:20px;font-size:9px;font-weight:700;background:#edf1f5;color:#53687a}.ok{background:#e8f7ef;color:#11774e}.warn{background:#fff4d5;color:#966700}.err{background:#ffedf0;color:#ae3442}.info{background:#eaf3ff;color:#2e68a4}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.module{background:#fff;border:1px solid var(--b);border-radius:8px;padding:13px}.module:hover{border-color:#79bdc2;box-shadow:0 5px 15px #17384f10}.module b{font-size:12px}.module small{display:block;color:var(--m);font-size:10px;margin-top:4px}.module .btn{margin-top:9px}
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:14px}.pipe{background:#fff;border:1px solid var(--b);border-top:3px solid var(--a);border-radius:7px;padding:9px;text-align:center;color:var(--m);font-size:10px}.pipe b{display:block;color:var(--t);margin-bottom:3px}
.modal{position:fixed;inset:0;background:#09162599;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.mbox{width:min(860px,100%);max-height:90vh;overflow:auto;border-radius:14px;background:#f5f9fc;box-shadow:0 25px 90px #0004;animation:pop .18s ease}.mhead{padding:16px 19px;background:linear-gradient(135deg,#182235,#147f8e,#53d4cf);color:#fff;display:flex;justify-content:space-between}.mhead b{font-size:15px}.close{border:1px solid #ffffff44;background:#ffffff17;color:#fff;border-radius:6px;font-size:20px}.mbody{padding:20px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{background:#fff;border:1px solid var(--b);padding:11px;border-radius:9px}.field label{display:block;color:#5c7183;font-size:9px;text-transform:uppercase;margin-bottom:6px;font-weight:700}.field input,.field select{width:100%;padding:9px;border:1px solid #c7d5df;border-radius:7px;outline:0}.field input:focus,.field select:focus{border-color:var(--a);box-shadow:0 0 0 3px #53d4cf22}.mfoot{padding:13px 19px;background:#fff;border-top:1px solid var(--b);display:flex;justify-content:flex-end;gap:7px}
.login{position:fixed;inset:0;background:radial-gradient(circle at 15% 15%,#355f82,#182235 45%,#0a1421);display:none;align-items:center;justify-content:center;z-index:100}.login.show{display:flex}.loginbox{width:390px;max-width:92%;background:#fff;border-radius:12px;padding:25px;box-shadow:0 25px 80px #0005}.llogo{font-size:27px;font-weight:800}.llogo span{color:var(--p)}.loginbox h1{font-size:19px;margin:7px 0}.loginbox p{font-size:11px;color:var(--m);margin-bottom:17px}
.toast{position:fixed;right:18px;bottom:18px;background:#19334b;color:#fff;border-left:4px solid var(--a);padding:11px 13px;border-radius:7px;display:none;z-index:200}.toast.show{display:block}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1050px){.side{width:240px}.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.side{width:70px}.logo{font-size:0;justify-content:center}.logo:after{content:'AY';font-size:20px}.firm,.mi .num,.mi .txt,.arr,.gt{display:none}.mi{justify-content:center}.kpis{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}
</style>

<div id="login" class="login show">
 <div class="loginbox">
  <div class="llogo">Arda <span>YIŞ</span></div><h1>ERP Sistemi</h1>

 </div>

<div class="app">
<aside class="side"><div class="logo">Arda <b>YIŞ</b></div><div class="firm"><small>Aktif Firma</small><strong>Arda Üretim Ltd. Şti.</strong><span>2026 / 09 • Merkez</span></div><div id="menu" class="scroll"></div><div class="ver">Arda YIŞ ERP • Yönetim sistemi</div></aside>
<main class="main"><header class="top"><h2 id="title">Yönetim Merkezi</h2><div class="search"><input id="search" placeholder="ERP'de ara..." oninput="searchAll(this.value)"></div><div class="tools"><button class="ico" onclick="backup()">⇩</button><button class="ico" onclick="document.getElementById('file').click()">⇧</button><button class="ico" onclick="toast('Bildirimler kontrol edildi')">🔔</button><div class="usr"><div class="av">AY</div><div><b>Arda YIŞ</b><small id="role">Sistem Yöneticisi</small></div></div></div></header><section id="content" class="content"></section></main></div>

<div id="modal" class="modal"><div class="mbox"><div class="mhead"><b id="mtitle"></b><button class="close" onclick="closeM()">×</button></div><div class="mbody" id="mbody"></div><div class="mfoot"><button class="btn" onclick="closeM()">Vazgeç</button><button class="btn primary" id="msave">Kaydet</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const menu={
Yönetim:['Dashboard','Firma / Şube','Dönem Yönetimi','Kullanıcılar','Roller','Yetki Matrisi','Onay Süreçleri','İşlem Logları','Bildirimler','İş Akışları','Görevler'],
Tanımlar:['Ürünler','Ürün Grupları','Birimler','Depolar','Lokasyonlar','Vergiler','Fiyat Listeleri','Para Birimleri','Ödeme Tipleri','Ödeme Planları','Masraf Merkezleri'],
'Stok & Depo':['Stok Kartları','Giriş','Çıkış','Transfer','Sayım','Fire','Seri No','Lot','Barkod','Stok Hareketleri','Stok Değerleme','Min / Max','Rezervasyon','Kit / Set','Envanter Raporları'],
Üretim:['Ürün Ağacı','Reçete','Operasyon','Rota','İş İstasyonu','Makine','Üretim Planı','Üretim Emri','İş Emri','MRP','Hammadde Tüketimi','Mamul Girişi','Fire / Hurda','Duruş','Üretim Maliyeti','Üretim Raporları','Üretim Takibi','Operatör Takibi'],
'Üretim Planlama':['Ana Üretim Planı','Talep Tahmini','Kapasite Planlama','Malzeme İhtiyaç Planlama','Kapasite Yükleme','Çizelgeleme','Darboğaz Analizi','Üretim Takvimi','Vardiya Planı','Termin Planlama','Plan Revizyonları'],
'Kalite Yönetimi':['Giriş Kalite','Üretim Kalite','Son Kontrol','Ölçüm','Kabul / Red','Uygunsuzluk','Düzeltici Faaliyet','Lot İzlenebilirliği','Numune Planı','Kalite Parametreleri','Kalite Raporları'],
'Bakım Yönetimi':['Makine','Arıza','Bakım Emri','Periyodik Bakım','Yedek Parça','Bakım Geçmişi','Bakım Maliyeti','Sayaçlar','Duruş Analizi','Bakım Planlama'],
'Sevkiyat & Lojistik':['Sevk Emirleri','Araçlar','Şoförler','Yükleme','Teslimat','Rota','Kargo','Sevkiyat Geçmişi','Paketleme','Teslim Belgesi'],
'Satış Yönetimi':['Müşteriler','Teklifler','Siparişler','Onay','Sevkiyat','İrsaliye','Faturalama','İadeler','Fiyat Listeleri','İskonto','Kampanyalar','Satış Hedefleri'],
'Satın Alma':['Tedarikçiler','Talepler','Teklifler','Teklif Karşılaştırma','Siparişler','Mal Kabul','İade','Fiyat Geçmişi','Tedarikçi Performansı','Satın Alma Planı'],
CRM:['Müşteri Adayları','Fırsatlar','Görüşmeler','Aktiviteler','Hatırlatmalar','Teklif Takibi','Kampanyalar','Segmentler','Satış Hunisi'],
Servis:['Servis Talepleri','Servis Emirleri','Teknisyenler','Arızalar','Garanti','Servis Geçmişi','Sözleşmeler','Yedek Parça'],
Cari:['Müşteri Cari','Tedarikçi Cari','Borç / Alacak','Ekstre','Tahsilat','Ödeme','Vade','Risk','Mutabakat','Cari Yaşlandırma'],
Finans:['Kasa','Banka','Gelir','Gider','Tahsilat','Ödeme','Nakit Akışı','Çek / Senet','Banka Ekstreleri','Finans Raporları'],
Muhasebe:['Hesap Planı','Muhasebe Fişleri','Yevmiye','Büyük Defter','Mizan','Dönem İşlemleri','KDV','BA / BS','Amortisman','Muhasebe Raporları'],
'Maliyet Yönetimi':['Maliyet Merkezleri','Standart Maliyet','Fiili Maliyet','Üretim Maliyeti','Ürün Maliyeti','İşçilik Maliyeti','Genel Üretim Giderleri','Sapma Analizi','Kârlılık Analizi'],
'İnsan Kaynakları':['Personel','Departman','Pozisyon','Vardiya','İzin','Puantaj','Mesai','Performans','Kariyer','Eğitim','İşe Alım'],
'Bordro & Özlük':['Personel Özlük','Bordro Dönemi','Bordro Hesaplama','SGK','Vergiler','Avanslar','Kesintiler','Bordro Raporları'],
'Proje Yönetimi':['Projeler','Görevler','Takvim','Maliyet','Gelir','Proje Kârlılığı','Kaynak Planlama','Hakediş','Proje Raporları'],
'Bütçe Yönetimi':['Bütçe Tanımları','Gelir Bütçesi','Gider Bütçesi','Departman Bütçesi','Yatırım Bütçesi','Gerçekleşme','Sapma Analizi','Bütçe Raporları'],
'Doküman Yönetimi':['Dokümanlar','Sözleşmeler','Prosedürler','Talimatlar','Revizyonlar','Arşiv','Doküman Onayları'],
'Araç & Filo':['Araç Kartları','Şoförler','Yakıt','Kilometre','Sigorta','Muayene','Bakım','Lastik','Filo Maliyetleri'],
'BI & Analitik':['Yönetim KPI','Satış Analitiği','Üretim Analitiği','Stok Analitiği','Finans Analitiği','Maliyet Analitiği','Kârlılık','Trendler','Panolar'],
'Rapor Merkezi':['Yönetim','Stok','Üretim','Satış','Satın Alma','Cari','Finans','Muhasebe','Maliyet','Kârlılık','KPI','Grafikler','Excel / PDF','Özel Rapor Tasarımcısı'],
'Sistem & Güvenlik':['Kullanıcı','Rol','Yetki','Yetki Matrisi','Şifre Politikası','Oturum','İşlem Logları','Yedekleme','Geri Yükleme','Sistem Ayarları','Erişim Kayıtları']
};
const fields={
products:['Kod','Ürün Adı','Grup','Birim','Min. Stok','Fiyat'],
customers:['Cari Kodu','Müşteri Adı','Vergi No','Telefon','E-posta'],
suppliers:['Tedarikçi Kodu','Tedarikçi Adı','Vergi No','Telefon','E-posta'],
warehouses:['Depo Kodu','Depo Adı','Lokasyon','Sorumlu'],
production:['Emir No','Ürün','Miktar','Tarih','Durum'],
bom:['Reçete No','Mamul','Hammadde','Miktar','Birim'],
sales:['Sipariş No','Müşteri','Ürün','Miktar','Tutar','Durum'],
purchases:['Sipariş No','Tedarikçi','Ürün','Miktar','Tutar','Durum'],
current:['Tarih','Cari','İşlem','Tutar','Açıklama'],
finance:['Tarih','Hesap','İşlem','Tutar','Açıklama'],
accounting:['Tarih','Fiş No','Borç Hesabı','Alacak Hesabı','Tutar'],
quality:['Tarih','Ürün','Lot','Kontrol','Sonuç','Not'],
maintenance:['Makine','Tip','Tarih','Sorumlu','Durum'],
crm:['Müşteri Adayı','Fırsat','Değer','Aşama','Sonraki Tarih'],
employees:['Personel No','Ad Soyad','Departman','Pozisyon','Vardiya','Durum'],
projects:['Proje No','Proje Adı','Müşteri','Bütçe','Durum'],
services:['Servis No','Müşteri','Cihaz','Arıza','Teknisyen','Durum'],
users:['Kullanıcı Kodu','Ad Soyad','Rol','Şifre','Durum'],
roles:['Rol Kodu','Rol Adı','Açıklama'],
logs:['Tarih','Kullanıcı','İşlem','Modül','Detay']
};
let db=JSON.parse(localStorage.getItem('ardaData')||'{}');
const keys=Object.keys(fields);
keys.forEach(k=>db[k]??=[]);
db.users.length||db.users.push({id:uid(),a:'ADMIN',b:'Arda YIŞ',c:'Sistem Yöneticisi',d:'1234',e:'Aktif'});
db.products.length||db.products.push({id:uid(),a:'HM-001',b:'Çelik Sac',c:'Hammadde',d:'KG',e:'500',f:'35'});
db.customers.length||db.customers.push({id:uid(),a:'C0001',b:'Demo Müşteri',c:'1111111111',d:'',e:''});
db.suppliers.length||db.suppliers.push({id:uid(),a:'T0001',b:'Demo Tedarikçi',c:'2222222222',d:'',e:''});
save();
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function save(){localStorage.setItem('ardaData',JSON.stringify(db))}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m])}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}function build(){
 let el=document.getElementById('menu'),last='';
 Object.keys(menu).forEach((name,i)=>{
  let g=document.createElement('div');
  g.className='grp';
  g.dataset.name=name;

  g.innerHTML=
  '<button class="mi" onclick="toggleGrp(this.parentElement)">'+
  '<span class="num">'+String(i+1).padStart(2,'0')+'</span>'+
  '<span class="ico">◆</span>'+
  '<span class="txt">'+esc(name)+'</span>'+
  '<span class="arr">›</span>'+
  '</button>'+
  '<div class="sub">'+
  menu[name].map((s,j)=>
    '<button onclick="sub(event,\''+name.replace(/'/g,"\\'")+'\','+j+')">'+
    String(j+1).padStart(2,'0')+' '+esc(s)+
    '</button>'
  ).join('')+
  '</div>';

  el.appendChild(g);
 })
}

function toggleGrp(g){
 document.querySelectorAll('.grp').forEach(x=>{
  if(x!==g)x.classList.remove('open');
 });
 g.classList.toggle('open');
}

function sub(e,name,i){
 e.stopPropagation();

 let g=[...document.querySelectorAll('.grp')]
   .find(x=>x.dataset.name===name);

 if(g)g.classList.add('open');

 document.querySelectorAll('.sub button')
   .forEach(x=>x.classList.remove('active'));

 e.currentTarget.classList.add('active');

 document.getElementById('title').textContent=
 name+' / '+menu[name][i];

 render(name,i);
}

function shell(t,p,btn){
 document.getElementById('content').innerHTML=
 '<div class="head">'+
   '<div>'+
     '<h1>'+esc(t)+'</h1>'+
     '<p>'+esc(p)+'</p>'+
   '</div>'+
   '<div class="btns">'+(btn||'')+'</div>'+
 '</div>';
}

function render(name,i){

 let label=menu[name][i];

 if(name==='Yönetim' && i===0){
  dashboard();
  return;
 }

 if(name==='Yönetim' && i===5){
  permissions();
  return;
 }

 let actionKey=keyFor(name,label);

 let buttons='';

 if(actionKey){
  buttons=
   '<button class="btn primary" onclick="newRec(\''+
   actionKey+
   '\')">+ Yeni Kayıt</button>';
 }

 shell(label,'İşlemler ve kayıtlar',buttons);

 document.getElementById('content').insertAdjacentHTML(
  'beforeend',
  '<div class="subnav">'+
  menu[name].map((s,j)=>
   '<button class="'+
   (j===i?'active':'')+
   '" onclick="sub(event,\''+
   name.replace(/'/g,"\\'")+
   '\','+j+')">'+
   String(j+1).padStart(2,'0')+
   ' '+esc(s)+
   '</button>'
  ).join('')+
  '</div>'
 );

 if(
   name==='Üretim' ||
   name==='Üretim Planlama' ||
   name==='Satış Yönetimi' ||
   name==='Satın Alma'
 ){
  document.getElementById('content').insertAdjacentHTML(
   'beforeend',
   '<div class="pipeline">'+

function keyFor(name,label){

 let map={
  'Üretim':'production',
  'Üretim Planlama':'production',
  'Satış Yönetimi':'sales',
  'Satın Alma':'purchases',
  'Stok & Depo':'products',
  'Tanımlar':'products',
  'Cari':'current',
  'Finans':'finance',
  'Muhasebe':'accounting',
  'Kalite Yönetimi':'quality',
  'Bakım Yönetimi':'maintenance',
  'CRM':'crm',
  'Servis':'services',
  'İnsan Kaynakları':'employees',
  'Proje Yönetimi':'projects',
  'Sistem & Güvenlik':'users',
  'Yönetim':'users'
 };

 if(label==='Ürünler' || label==='Stok Kartları')
  return 'products';

 if(label==='Müşteriler' || label==='Müşteri Cari')
  return 'customers';

 if(label==='Tedarikçiler' || label==='Tedarikçi Cari')
  return 'suppliers';

 if(label==='Depolar')
  return 'warehouses';

 if(label==='Ürün Ağacı' || label==='Reçete')
  return 'bom';

 if(label==='Üretim Emri' || label==='İş Emri')
  return 'production';

 if(label==='Siparişler' || label==='Teklifler')
  return name==='Satın Alma' ? 'purchases' : 'sales';

 return map[name];
}

function table(k){

 let c=document.getElementById('content');
 let fs=fields[k];
 let rows=db[k]||[];

 c.insertAdjacentHTML(
  'beforeend',
  '<div class="table">'+
   '<div class="filter">'+
    '<input id="flt" placeholder="Listede ara..." oninput="flt(\''+
      k+
    '\',this.value)">'+
    '<button class="btn sm primary" onclick="newRec(\''+
      k+
    '\')">+ Yeni Kayıt</button>'+
   '</div>'+

   '<table>'+
    '<thead>'+
     '<tr>'+
      fs.map(f=>'<th>'+f+'</th>').join('')+
      '<th>İşlem</th>'+
     '</tr>'+
    '</thead>'+

    '<tbody id="rows">'+
     rowsHTML(k,rows)+
    '</tbody>'+
   '</table>'+

  '</div>'
 );
}

function rowsHTML(k,rows){

 let fs=fields[k];

 if(!rows.length){
  return '<tr>'+
   '<td colspan="'+(fs.length+1)+'" style="text-align:center;padding:30px;color:#77899b">'+
   'Kayıt bulunamadı'+
   '</td>'+
   '</tr>';
 }

 return rows.map(r=>
  '<tr>'+
   fs.map((f,i)=>
    '<td>'+
      esc(r[String.fromCharCode(97+i)]||'')+
    '</td>'
   ).join('')+

   '<td>'+
    '<button class="btn sm" onclick="editRec(\''+
      k+
      '\',\''+
      r.id+
    '\')">Düzenle</button> '+

    '<button class="btn sm danger" onclick="delRec(\''+
      k+
      '\',\''+
      r.id+
    '\')">Sil</button>'+
   '</td>'+
  '</tr>'
 ).join('');
}

function flt(k,q){

 let rs=db[k].filter(r=>
  JSON.stringify(r)
   .toLowerCase()
   .includes(q.toLowerCase())
 );

 document.getElementById('rows').innerHTML=
  rowsHTML(k,rs);
}

function newRec(k,id=null){

 let fs=fields[k];

 let r=id
  ? db[k].find(x=>x.id===id)
  : {};

 let inputs=fs.map((f,i)=>
  '<div class="field">'+
   '<label>'+f+'</label>'+
   '<input id="f'+i+'" value="'+
      esc(r[String.fromCharCode(97+i)]||'')+
   '">'+
  '</div>'
 ).join('');

 document.getElementById('mtitle').textContent=
  (id?'Düzenle: ':'Yeni Kayıt: ')+
  k.toUpperCase();

 document.getElementById('mbody').innerHTML=
  '<div style="font-size:11px;color:#687b8d;margin-bottom:12px">'+
   'Bilgileri doldurun ve Kaydet ile ERP kaydını oluşturun.'+
  '</div>'+
  '<div class="form">'+
   inputs+
  '</div>';

 document.getElementById('msave').onclick=()=>{

  let o=id
   ? db[k].find(x=>x.id===id)
   : {id:uid()};

  fs.forEach((f,i)=>{
   o[String.fromCharCode(97+i)] =
    document.getElementById('f'+i).value;
  });

  if(!id)
   db[k].unshift(o);

  save();

  closeM();

  toast('Kayıt kaydedildi');

  location.reload();
 };

 document.getElementById('modal').classList.add('show');
}

function editRec(k,id){
 newRec(k,id);
}

function delRec(k,id){

 if(!confirm('Kaydı silmek istiyor musunuz?'))
  return;

 db[k]=db[k].filter(x=>x.id!==id);

 save();

 toast('Kayıt silindi');

 location.reload();
}

function closeM(){
 document.getElementById('modal')
  .classList.remove('show');
}

function savePerm(){

 document.querySelectorAll('#perm input')
  .forEach(x=>{

   if(x.checked){
    p[
     x.dataset.k+
     '|'+
     x.dataset.r+
     '|'+
     x.dataset.a
    ]=1;
   }

  });

 localStorage.setItem(
  'ardaPerm',
  JSON.stringify(p)
 );

 toast('Yetkiler kaydedildi');
}

function searchAll(q){

 if(q.length<2)
  return;

 for(let k of keys){

  let x=db[k].find(r=>
   JSON.stringify(r)
    .toLowerCase()
    .includes(q.toLowerCase())
  );

  if(x){
   newRec(k,x.id);
   return;
  }
 }

 toast('Arama sonucu bulunamadı');
}

function login(){

 let u = document.getElementById('lu').value.trim().toUpperCase();
 let p = document.getElementById('lp').value.trim();

 let x = db.users.find(r => {

  let code = String(r.code ?? r.a ?? '').trim().toUpperCase();
  let pass = String(r.password ?? r.d ?? '').trim();
  let status = String(r.status ?? r.e ?? 'Aktif').trim();

  return code === u &&
         pass === p &&
         status === 'Aktif';
 });

 if(!x){
  alert('Kullanıcı kodu veya şifre hatalı.\n\nDemo giriş:\nADMIN\n1234');
  return;
 }

 let userName = x.name ?? x.b ?? 'Arda YIŞ';
 let userRole = x.role ?? x.c ?? 'Sistem Yöneticisi';

 localStorage.setItem(
  'ardaSession',
  JSON.stringify({
   name: userName,
   role: userRole
  })
 );

 document.getElementById('login').classList.remove('show');
 document.getElementById('role').textContent = userRole;

 toast('Hoş geldiniz, ' + userName);
}
